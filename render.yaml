services:
  - type: web
    name: manishka-portfolio
    env: node
    buildCommand: |
      apt-get update && apt-get install -y python3 python3-pip
      python3 -m pip install -r requirements.txt
      npm install
      cd client && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Set your Gemini key in the dashboard (GEMINI_API_KEY, GOOGLE_API_KEY, or API_KEY)
      - key: API_KEY
        sync: false